name: Deploy to GitHub Pages

# Builds the site and publishes dist/ to GitHub Pages on every push to main.
# Served from the root of the custom subdomain in CNAME, so no --base override is
# needed (unlike what-can-i-do, which lives on a project path).
#
# NOTE: this does NOT deploy firestore.rules. Rules are deployed separately with
#   firebase deploy --only firestore:rules
# See docs/deploy.md — it is the easy step to forget.

on:
  push:
    branches: [main]
  # TEMPORARY — remove before merge. There is otherwise no way to test a change
  # to this workflow without pushing it to main and finding out in production.
  # The deploy job is guarded below so a pull request builds but never publishes.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 24, not 22: Node 20 went end-of-life on 2026-04-30, and 22 is already
          # in maintenance (EOL 2027-04-30). 24 is the current active LTS
          # (EOL 2028-04-30) and is nearest to what this is developed on.
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build
        # The Firebase web config is public by design (see .env.example), but it
        # still lives in repo secrets so a fork can point at its own project.
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_AI_WORKER_URL: ${{ secrets.VITE_AI_WORKER_URL }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only main ever reaches production. Without this, running the workflow on a
    # branch — by dispatch or by a pull_request trigger — would publish that
    # branch to the live site, which is why the workflow was previously
    # untestable except by pushing to main.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
